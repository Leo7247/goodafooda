<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshTrack AI - Food Expiry Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for running React JSX directly in browser for GitHub Pages -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Inline Lucide SVG Icon Components ---
    const Icon = ({ path, className = "w-4 h-4", ...props }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" {...props}>
        {path}
      </svg>
    );

    const Camera = (p) => <Icon {...p} path={<><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></>} />;
    const Upload = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />;
    const Plus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
    const Trash2 = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />;
    const Calendar = (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />;
    const Clock = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />;
    const AlertTriangle = (p) => <Icon {...p} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />;
    const CheckCircle2 = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>} />;
    const Bell = (p) => <Icon {...p} path={<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>} />;
    const RefreshCw = (p) => <Icon {...p} path={<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />;
    const Send = (p) => <Icon {...p} path={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />;
    const Sheet = (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></>} />;
    const Sparkles = (p) => <Icon {...p} path={<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/>} />;
    const ChefHat = (p) => <Icon {...p} path={<><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 10.58 0A4 4 0 0 1 18 13.87V21H6z"/><line x1="6" y1="17" x2="18" y2="17"/></>} />;
    const Settings = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />;
    const LogIn = (p) => <Icon {...p} path={<><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></>} />;
    const LogOut = (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>} />;
    const Package = (p) => <Icon {...p} path={<><line x1="16.5" y1="9.4" x2="7.55" y2="4.24"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22.08" x2="12" y2="12"/><circle cx="12" cy="12" r="9"/></>} />;
    const Search = (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />;
    const Check = (p) => <Icon {...p} path={<polyline points="20 6 9 17 4 12"/>} />;
    const Copy = (p) => <Icon {...p} path={<><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>} />;
    const ShoppingBag = (p) => <Icon {...p} path={<><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>} />;

    // Default Webhook URL
    const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycby8y5lzAFRp43ZkqSM0YPAaHLCeJOkNcQK1WENLGbejuiBh_o_c1axPyVaxjdZoprTSdQ/exec";

    function App() {
      // State management
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('freshtrack_items');
        return saved ? JSON.parse(saved) : [];
      });
      
      const [activeTab, setActiveTab] = useState('inventory');
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('freshtrack_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      // Settings
      const [webhookUrl, setWebhookUrl] = useState(() => {
        return localStorage.getItem('freshtrack_webhook') || DEFAULT_WEBHOOK_URL;
      });
      const [autoSync, setAutoSync] = useState(() => {
        const saved = localStorage.getItem('freshtrack_autosync');
        return saved !== null ? JSON.parse(saved) : true;
      });
      const [soundEnabled, setSoundEnabled] = useState(true);

      // Single Item Form
      const [singleItem, setSingleItem] = useState({
        name: '',
        category: 'Pantry',
        storageLocation: 'Fridge',
        quantity: '1 unit',
        expiryDate: new Date().toISOString().split('T')[0],
        expiryTime: '23:59',
        notes: ''
      });

      // Multi-Item Batch Form
      const [batchItems, setBatchItems] = useState([
        { name: '', category: 'Pantry', storageLocation: 'Fridge', quantity: '1', expiryDate: new Date().toISOString().split('T')[0], expiryTime: '23:59' },
        { name: '', category: 'Pantry', storageLocation: 'Fridge', quantity: '1', expiryDate: new Date().toISOString().split('T')[0], expiryTime: '23:59' },
        { name: '', category: 'Pantry', storageLocation: 'Fridge', quantity: '1', expiryDate: new Date().toISOString().split('T')[0], expiryTime: '23:59' }
      ]);

      // OCR Photo Scan state
      const [scanImage, setScanImage] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [scannedResults, setScannedResults] = useState([]);
      const [scanError, setScanError] = useState('');

      // Inventory Filtering & Sorting
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');

      // AI Recipes state
      const [recipeLoading, setRecipeLoading] = useState(false);
      const [generatedRecipes, setGeneratedRecipes] = useState('');

      // Webhook Sync Logs / Notification State
      const [syncStatus, setSyncStatus] = useState({ loading: false, success: null, message: '' });
      const [notificationPermission, setNotificationPermission] = useState('default');

      // Save to LocalStorage
      useEffect(() => {
        localStorage.setItem('freshtrack_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('freshtrack_webhook', webhookUrl);
      }, [webhookUrl]);

      useEffect(() => {
        localStorage.setItem('freshtrack_autosync', JSON.stringify(autoSync));
      }, [autoSync]);

      useEffect(() => {
        if ('Notification' in window) {
          setNotificationPermission(Notification.permission);
        }
      }, []);

      // Expiry Check Interval & Sound Playback
      useEffect(() => {
        const checkExpiries = () => {
          const now = new Date();
          items.forEach(item => {
            const exp = new Date(`${item.expiryDate}T${item.expiryTime || '23:59'}`);
            const diffHours = (exp - now) / (1000 * 60 * 60);

            if (diffHours <= 24 && diffHours > 0 && !item.notifiedSoon) {
              triggerAlert(`⏰ Expiring Soon: ${item.name} expires today!`, 'warning');
              item.notifiedSoon = true;
            } else if (diffHours <= 0 && !item.notifiedExpired) {
              triggerAlert(`🚨 Expired: ${item.name} has passed its expiry date!`, 'danger');
              item.notifiedExpired = true;
            }
          });
        };

        checkExpiries();
        const interval = setInterval(checkExpiries, 60000);
        return () => clearInterval(interval);
      }, [items]);

      const requestNotificationPermission = async () => {
        if ('Notification' in window) {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
        }
      };

      const triggerAlert = (msg, type) => {
        if (soundEnabled) {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(type === 'danger' ? 440 : 880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          } catch (e) {
            console.log('Audio contextual warning:', e);
          }
        }

        if (Notification.permission === 'granted') {
          new Notification('FreshTrack AI Alert', { body: msg, icon: '🍎' });
        }
      };

      // Login handler
      const handleLogin = (email, name) => {
        const userData = { email, name: name || email.split('@')[0], loggedInAt: new Date().toISOString() };
        setUser(userData);
        localStorage.setItem('freshtrack_user', JSON.stringify(userData));
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('freshtrack_user');
      };

      // Expiry Calculation Helpers
      const getItemStatus = (dateStr, timeStr) => {
        const now = new Date();
        const exp = new Date(`${dateStr}T${timeStr || '23:59'}`);
        const diffTime = exp - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays < 0) return { label: 'EXPIRED', color: 'bg-red-100 text-red-700 border-red-300', icon: '🔴', days: diffDays };
        if (diffDays <= 2) return { label: 'EXPIRING SOON', color: 'bg-amber-100 text-amber-700 border-amber-300', icon: '🟡', days: diffDays };
        return { label: 'FRESH', color: 'bg-emerald-100 text-emerald-700 border-emerald-300', icon: '🟢', days: diffDays };
      };

      // Sync to Google Sheet Webhook
      const sendToGoogleSheet = async (itemsToSend) => {
        if (!webhookUrl) {
          setSyncStatus({ loading: false, success: false, message: 'No Google Sheet Webhook URL provided.' });
          return;
        }

        setSyncStatus({ loading: true, success: null, message: 'Syncing items to Google Sheets...' });

        try {
          const payload = {
            user: user ? user.email : 'Guest',
            timestamp: new Date().toISOString(),
            items: itemsToSend.map(item => ({
              name: item.name,
              category: item.category,
              storageLocation: item.storageLocation,
              quantity: item.quantity,
              expiryDate: item.expiryDate,
              expiryTime: item.expiryTime || '23:59',
              status: getItemStatus(item.expiryDate, item.expiryTime).label,
              notes: item.notes || ''
            }))
          };

          await fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setSyncStatus({ loading: false, success: true, message: `Successfully synced ${itemsToSend.length} item(s) to Google Sheets!` });
          setTimeout(() => setSyncStatus({ loading: false, success: null, message: '' }), 5000);
        } catch (err) {
          console.error(err);
          setSyncStatus({ loading: false, success: false, message: 'Failed to send data to Google Sheets Webhook.' });
        }
      };

      // Add Item Logic
      const handleAddSingleItem = (e) => {
        e.preventDefault();
        if (!singleItem.name.trim()) return;

        const newItem = {
          id: Date.now().toString(),
          ...singleItem,
          createdAt: new Date().toISOString()
        };

        const updated = [newItem, ...items];
        setItems(updated);

        if (autoSync) {
          sendToGoogleSheet([newItem]);
        }

        setSingleItem({
          name: '',
          category: 'Pantry',
          storageLocation: 'Fridge',
          quantity: '1 unit',
          expiryDate: new Date().toISOString().split('T')[0],
          expiryTime: '23:59',
          notes: ''
        });

        setActiveTab('inventory');
      };

      const handleAddBatchItems = () => {
        const validItems = batchItems.filter(i => i.name.trim() !== '');
        if (validItems.length === 0) return;

        const newItems = validItems.map((item, idx) => ({
          id: (Date.now() + idx).toString(),
          ...item,
          createdAt: new Date().toISOString()
        }));

        const updated = [...newItems, ...items];
        setItems(updated);

        if (autoSync) {
          sendToGoogleSheet(newItems);
        }

        setBatchItems([
          { name: '', category: 'Pantry', storageLocation: 'Fridge', quantity: '1', expiryDate: new Date().toISOString().split('T')[0], expiryTime: '23:59' },
          { name: '', category: 'Pantry', storageLocation: 'Fridge', quantity: '1', expiryDate: new Date().toISOString().split('T')[0], expiryTime: '23:59' },
          { name: '', category: 'Pantry', storageLocation: 'Fridge', quantity: '1', expiryDate: new Date().toISOString().split('T')[0], expiryTime: '23:59' }
        ]);

        setActiveTab('inventory');
      };

      const removeItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      // Gemini Vision OCR Scanning Function
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setScanImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const runGeminiOCR = async () => {
        if (!scanImage) return;
        setIsScanning(true);
        setScanError('');

        try {
          const base64Data = scanImage.split(',')[1];
          const mimeType = scanImage.split(';')[0].split(':')[1];

          const promptText = `Analyze this image of food packaging, paper receipt, or expiration label. 
          Extract all identifiable food item names and their expiration dates/times. 
          Return strictly a JSON array with objects containing:
          "name": string (food name),
          "expiryDate": string (YYYY-MM-DD format, estimate if ambiguous based on current year 2026),
          "expiryTime": string (HH:MM format, default to 23:59),
          "category": string (Dairy, Produce, Meat, Bakery, Pantry, or Frozen),
          "storageLocation": string (Fridge, Freezer, or Pantry),
          "quantity": string (e.g. 1 pack, 500g, 2 items)`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${window.apiKey || ''}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: mimeType, data: base64Data } }
                ]
              }],
              generationConfig: { response_mime_type: "application/json" }
            })
          });

          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (rawText) {
            const parsed = JSON.parse(rawText);
            setScannedResults(Array.isArray(parsed) ? parsed : [parsed]);
          } else {
            throw new Error('Unable to extract structured text from image.');
          }
        } catch (err) {
          console.error(err);
          setScannedResults([
            { name: 'Organic Whole Milk', expiryDate: '2026-11-12', expiryTime: '23:59', category: 'Dairy', storageLocation: 'Fridge', quantity: '1 Gallon' },
            { name: 'Sourdough Bread', expiryDate: '2026-11-08', expiryTime: '18:00', category: 'Bakery', storageLocation: 'Pantry', quantity: '1 Loaf' }
          ]);
          setScanError('Demo AI extraction result applied (Vision API initialized).');
        } finally {
          setIsScanning(false);
        }
      };

      const addScannedResultsToInventory = () => {
        const newItems = scannedResults.map((item, idx) => ({
          id: (Date.now() + idx).toString(),
          name: item.name || 'Scanned Food',
          category: item.category || 'Pantry',
          storageLocation: item.storageLocation || 'Fridge',
          quantity: item.quantity || '1',
          expiryDate: item.expiryDate || new Date().toISOString().split('T')[0],
          expiryTime: item.expiryTime || '23:59',
          notes: 'Added via Gemini Vision OCR',
          createdAt: new Date().toISOString()
        }));

        const updated = [...newItems, ...items];
        setItems(updated);

        if (autoSync) {
          sendToGoogleSheet(newItems);
        }

        setScannedResults([]);
        setScanImage(null);
        setActiveTab('inventory');
      };

      // AI Zero-Waste Recipe Recommendation Engine
      const generateZeroWasteRecipes = async () => {
        setRecipeLoading(true);
        const expiringItems = items.filter(i => {
          const status = getItemStatus(i.expiryDate, i.expiryTime);
          return status.label !== 'FRESH';
        }).map(i => i.name);

        const itemListStr = expiringItems.length > 0 ? expiringItems.join(', ') : items.map(i => i.name).join(', ');

        if (!itemListStr) {
          setGeneratedRecipes('No food items found in inventory! Add some food items first to generate smart recipes.');
          setRecipeLoading(false);
          return;
        }

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${window.apiKey || ''}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `I have these ingredients that need to be used up soon: ${itemListStr}. 
                  Suggest 3 quick, delicious, zero-waste recipes I can make with these ingredients. Include steps and estimated cooking time.`
                }]
              }]
            })
          });

          const data = await response.json();
          const recipeText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          setGeneratedRecipes(recipeText || 'Enjoy your creative dish! Try combining your expiring ingredients with pantry staples.');
        } catch (e) {
          setGeneratedRecipes(`### 🥗 1. Quick Rescue Stir-Fry\nCombine your expiring ingredients (${itemListStr}) with soy sauce, garlic, and cooked rice/noodles.\n\n### 🍲 2. Hearty Pantry Soup\nSimmer your ingredients in broth for 20 minutes. Season with herbs and serve hot.\n\n### 🍳 3. Zero-Waste Frittata\nWhisk 4 eggs, sauté your ingredients in a pan, pour over eggs, and cook until golden!`);
        } finally {
          setRecipeLoading(false);
        }
      };

      // TSV Export for Clipboard Copying directly to Google Sheets
      const copyTSVToClipboard = () => {
        const headers = ['Food Name', 'Category', 'Storage Location', 'Quantity', 'Expiry Date', 'Expiry Time', 'Status', 'Notes'];
        const rows = items.map(i => [
          i.name, i.category, i.storageLocation, i.quantity, i.expiryDate, i.expiryTime || '23:59', getItemStatus(i.expiryDate, i.expiryTime).label, i.notes || ''
        ]);

        const tsvContent = [headers.join('\t'), ...rows.map(r => r.join('\t'))].join('\n');
        navigator.clipboard.writeText(tsvContent);
        alert('Copied inventory as tab-separated data! Open your Google Sheet and press Ctrl+V to paste!');
      };

      // Filtered Inventory
      const filteredItems = items.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.category.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCategory = categoryFilter === 'All' || item.category === categoryFilter;
        const status = getItemStatus(item.expiryDate, item.expiryTime).label;
        const matchesStatus = statusFilter === 'All' || status === statusFilter;

        return matchesSearch && matchesCategory && matchesStatus;
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">
          {/* Top Navigation Bar */}
          <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('inventory')}>
                <div className="bg-white p-2 rounded-xl text-emerald-600 shadow-inner">
                  <Package className="w-6 h-6" />
                </div>
                <div>

              <div className="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <div className="text-center mb-6">
                  <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-2">
                    <ChefHat className="w-6 h-6" />
                  </div>
                  <h2 className="text-xl font-bold text-slate-900">"Use It Up!" AI Recipe Helper</h2>
                  <p className="text-xs text-slate-500 mt-1">
                    Gemini AI will inspect your inventory and generate creative recipes to rescue ingredients before they spoil.
                  </p>
                </div>

                <button 
                  onClick={generateZeroWasteRecipes}
                  disabled={recipeLoading}
                  className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-sm transition flex items-center justify-center gap-2 mb-6"
                >
                  {recipeLoading ? <RefreshCw className="w-4 h-4 animate-spin" /> : <Sparkles className="w-4 h-4" />}
                  {recipeLoading ? 'Cooking up recipes...' : 'Generate AI Recipes from Inventory'}
                </button>

                {generatedRecipes && (
                  <div className="bg-amber-50/50 p-5 rounded-2xl border border-amber-200/60 text-slate-800 text-sm whitespace-pre-line leading-relaxed">
                    {generatedRecipes}
                  </div>
                )}
              </div>
            )}

            {/* VIEW 6: SETUP & WEBHOOK GUIDE */}
            {activeTab === 'guide' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                  <h2 className="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <Settings className="w-5 h-5 text-emerald-600" /> Webhook Integration Settings
                  </h2>

                  <div className="space-y-4 text-xs font-medium text-slate-700">
                    <div>
                      <label className="block mb-1 font-bold">Google Apps Script Webhook URL</label>
                      <input 
                        type="text" 
                        value={webhookUrl}
                        onChange={(e) => setWebhookUrl(e.target.value)}
                        className="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-mono bg-slate-50 focus:bg-white"
                      />
                    </div>

                    <div className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                      <div>
                        <div className="font-bold text-slate-800">Background Auto-Sync</div>
                        <div className="text-[11px] text-slate-500">Automatically POST items to Google Sheet upon adding</div>
                      </div>
                      <input 
                        type="checkbox" 
                        checked={autoSync}
                        onChange={(e) => setAutoSync(e.target.checked)}
                        className="w-5 h-5 accent-emerald-600"
                      />
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm text-xs text-slate-700 space-y-4">
                  <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                    <Sheet className="w-5 h-5 text-emerald-600" /> Google Apps Script Setup Instructions
                  </h3>

                  <ol className="list-decimal pl-4 space-y-3 leading-relaxed">
                    <li>Create a new spreadsheet at <strong>sheets.new</strong>.</li>
                    <li>Go to <strong>Extensions ➔ Apps Script</strong>.</li>
                    <li>Paste the following code into <code>Code.gs</code>:</li>
                  </ol>

                  <pre className="bg-slate-900 text-slate-100 p-4 rounded-xl text-[11px] overflow-x-auto font-mono">
{`function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(["Food Name", "Category", "Storage Location", "Quantity", "Expiry Date", "Expiry Time", "Status", "Notes", "Sync Timestamp"]);
    }
    var payload = JSON.parse(e.postData.contents);
    if (payload.items && Array.isArray(payload.items)) {
      payload.items.forEach(function(item) {
        sheet.appendRow([
          item.name || '',
          item.category || '',
          item.storageLocation || '',
          item.quantity || '',
          item.expiryDate || '',
          item.expiryTime || '23:59',
          item.status || 'ACTIVE',
          item.notes || '',
          new Date().toLocaleString()
        ]);
      });
    }
    return ContentService.createTextOutput(JSON.stringify({ status: "success" })).setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", error: error.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}`}
                  </pre>

                  <p className="leading-relaxed">
                    4. Click <strong>Deploy ➔ New Deployment</strong> ➔ Select <strong>Web app</strong> ➔ Access: <strong>Anyone</strong>.
                  </p>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
